name: CI

# Runs on pushes and on pull requests opened from branches of this repository.
# Pull requests from forks are deliberately excluded so that untrusted code is
# never executed automatically; review them, then start a run by hand with the
# "Run workflow" button.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # GitHub-hosted, not self-hosted: this is a public repository, and an
    # ephemeral runner is the right place for code that outsiders can propose.
    # Python 3.9 has no setup-python build for Ubuntu 26.04.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip jinja2

      - name: Byte-compile every source file
        run: python -m compileall -q mail_notifications.py

      - name: Run unit tests
        run: python -m unittest discover -v
